# k7s config — the defaults, compiled into k7s.
#
# k7s writes this file to ~/.config/k7s/config.yaml on the first start and
# then keeps it up to date (hidden sections and rows, last namespaces), so
# comments do not survive there. Edit it while k7s is not running.

# The file format. k7s migrates older files and never overwrites a newer one.
version: 3

# Sections toggled off with their key (g e r p m v s) stay off on the next start.
sections:
  hidden: []

# Rows in these states are not shown (toggle them in the filter pane, f).
#   pods:         running, pending, failing, completed
#   deployments:  ready, progressing, stuck, scaled-down
#   replicasets:  active, old (an earlier revision scaled to zero)
#   claims:       bound, pending, lost
#   volumes:      bound, available, released, failed
hide:
  pods: [completed]
  replicasets: [old]

# Commands the selected row offers, per section, and their keys (several:
# "l enter"). Commands not listed exist but are not offered; "*" is for every
# section ("pods: {}" offers no pod commands). Page keys (c n f, the section
# keys, q a Q A, j k G, digits, esc) win over commands. Available:
#   every section:  describe (kubectl describe), yaml (kubectl get -o yaml,
#                   secret values masked)
#   pods:           logs, previous-logs (kubectl logs -p), shell, forward
#   secrets:        open (values masked until r reveals them)
commands:
  "*":
    describe: d
  pods:
    logs: l enter
    shell: h
    forward: w
  secrets:
    open: enter

# Colors as "#rrggbb" (quoted: # starts a YAML comment). An ANSI number
# ("0"-"255") works too and follows your terminal's theme instead.
colors:
  good: "#5faf5f"       # green: running, synced, healthy
  busy: "#ffaf00"       # amber: on its way (pending, rolling out)
  warn: "#d7d700"       # yellow: worth a look (restarts, high usage)
  bad: "#d75f5f"        # red: failing
  info: "#00afaf"       # cyan: accents, the k7s badge, the menus' keys
  flash: "#d7d700"      # background of a cell that just changed
  selected: "#3a3a3a"   # background of the selected row
  linked: "#005f5f"     # background of rows linked to the selected one
  menu: "#303030"       # background of the menus
